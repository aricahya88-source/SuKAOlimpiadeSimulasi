                background: #ffffff;
                color: #0f172a;
                text-decoration: none;
                font-weight: 700;
                transition: transform .15s ease, border-color .15s ease;
              }

              a:hover {
                transform: translateY(-2px);
                border-color: #94a3b8;
              }

              small {
                display: block;
                margin-top: 6px;
                color: #64748b;
                font-weight: 400;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>SuKA Olimpiade Fisika</h1>
              <p>Pilih simulasi fisika yang ingin dibuka.</p>

              <div class="grid">
                <a href="./parabola/">
                  Gerak Parabola
                  <small>Kinematika dua dimensi</small>
                </a>

                <a href="./bidang-miring/">
                  Gaya Gesek Bidang Miring
                  <small>Gesek statis dan kinetis</small>
                </a>

                <a href="./tumbukan/">
                  Tumbukan
                  <small>Momentum dan restitusi</small>
                </a>

                <a href="./melingkar/">
                  Gerak Melingkar
                  <small>Gerak melingkar dan gaya sentripetal</small>
                </a>

                <a href="./hooke/">
                  Hukum Hooke
                  <small>Pegas dan osilasi</small>
                </a>

                <a href="./venturi/">
                  Fluida
                  <small>Venturi, Bernoulli, dan pancaran fluida</small>
                </a>

                <a href="./bandul/">
                  Bandul Matematis
                  <small>Periode dan osilasi bandul</small>
                </a>

                <a href="./gelombang/">
                  Gelombang
                  <small>Gelombang berjalan dan stasioner</small>
                </a>

                <a href="./kalor/">
                  Kalor & Perubahan Wujud
                  <small>Es, air, uap, dan partikel termal</small>
                </a>
              </div>
            </main>
          </body>
          </html>
          EOF

          for app in             parabola             bidang-miring             tumbukan             melingkar             hooke             venturi             bandul             gelombang             kalor
          do
            if [ ! -d "apps/$app/dist" ]; then
              echo "ERROR: apps/$app/dist tidak ditemukan."
              exit 1
            fi

            cp -R "apps/$app/dist" "site/$app"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
