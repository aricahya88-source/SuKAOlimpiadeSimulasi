
          for app in "${APPS[@]}"; do
            echo "Menyiapkan $app ..."

            if [ ! -f "apps/$app/dist/index.html" ]; then
              echo "::error::apps/$app/dist/index.html tidak ditemukan."
              exit 1
            fi

            mkdir -p "site/$app"
            cp -a "apps/$app/dist/." "site/$app/"

            if [ ! -f "site/$app/index.html" ]; then
              echo "::error::site/$app/index.html gagal dibuat."
              exit 1
            fi
          done

          echo "=== Verifikasi hasil Pages ==="
          test -f site/index.html
          echo "OK /index.html"

          for app in "${APPS[@]}"; do
            test -f "site/$app/index.html"
            echo "OK /$app/index.html"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
